<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BioMap 3D 생태 탐험</title>

    <link rel="stylesheet" href="./style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="game-container"></div>

    <div id="top-panel">
        <div class="logo">🌿 BIOMAP EXPLORER</div>
        <div id="habitat-name">대한민국 · 산림</div>
    </div>

    <div id="intro-panel">
        <h1>3D 생태 탐험</h1>

        <p>
            자연 속을 직접 탐험하며
            다양한 생물들을 발견해 보세요.
        </p>

        <button id="start-button">
            탐험 시작하기
        </button>
    </div>

    <div id="control-guide">
        <div><strong>W A S D</strong> 이동</div>
        <div><strong>마우스</strong> 시선 이동</div>
        <div><strong>클릭</strong> 생물 관찰</div>
        <div><strong>ESC</strong> 마우스 잠금 해제</div>
    </div>

    <div id="crosshair">+</div>

    <div id="species-panel" class="hidden">
        <button id="close-species">✕</button>

        <div id="species-emoji">🐿️</div>
        <h2 id="species-name">생물 이름</h2>
        <p id="species-type">생물 분류</p>
        <p id="species-description">생태 정보</p>
    </div>

    <div id="discovery-counter">
        발견한 생물: <span id="discovery-count">0</span>
    </div>
    
    <div id="coin-counter">
        <span class="coin-icon">🪙</span>
        <span>보유 코인</span>
        <strong id="coin-count">0</strong>
    </div>
    <div id="bottom-message">
        주변을 둘러보고 생물을 찾아보세요.
    </div>

        <div id="quest-panel">
        <div id="quest-title">🧭 탐험 목표</div>
        <div id="quest-description">새로운 생물을 5종 발견해 보세요!</div>
        <div id="quest-progress-track">
            <div id="quest-progress-bar"></div>
        </div>
        <div id="quest-progress-text">0 / 5종 발견</div>
        <div id="quest-reward">보상: 코인 30개</div>
    </div>

    <script type="module" src="./game.js"></script>
</body>
</html>
